<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Response</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        pre {
            background: #333;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Test Period Status API</h1>
    <button onclick="testAPI()">Test API Call</button>
    <button onclick="location.href='debug_period_status.php'">View Debug Page</button>
    
    <div class="result" id="result" style="display: none;">
        <h2>API Response:</h2>
        <pre id="jsonResponse"></pre>
        
        <h3>Parsed Values:</h3>
        <p><strong>Success:</strong> <span id="success"></span></p>
        <p><strong>Evaluation Open:</strong> <span id="evalOpen"></span></p>
        <p><strong>Active Period ID:</strong> <span id="periodId"></span></p>
        <p><strong>Active Period Name:</strong> <span id="periodName"></span></p>
        <p><strong>Academic Year:</strong> <span id="academicYear"></span></p>
        <p><strong>Semester:</strong> <span id="semester"></span></p>
        
        <h3>Button Should Be:</h3>
        <p id="buttonState"></p>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            try {
                const response = await fetch('periods_api.php?action=status', {
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                
                const data = await response.json();
                
                // Display raw JSON
                document.getElementById('jsonResponse').textContent = JSON.stringify(data, null, 2);
                
                // Parse values
                document.getElementById('success').innerHTML = data.success ? 
                    '<span class="success">TRUE</span>' : '<span class="error">FALSE</span>';
                
                document.getElementById('evalOpen').innerHTML = data.evaluation_open ? 
                    '<span class="success">TRUE (Open)</span>' : '<span class="error">FALSE (Closed)</span>';
                
                document.getElementById('periodId').textContent = data.active_period_id ?? 'NULL';
                document.getElementById('periodName').textContent = data.active_period_name ?? 'N/A';
                document.getElementById('academicYear').textContent = data.active_academic_year ?? 'N/A';
                document.getElementById('semester').textContent = data.active_semester ?? 'N/A';
                
                // Button state logic (from FacultyUser.js)
                const studentActive = true; // Assume student is active for this test
                const evaluationOpen = !!(data && data.success && data.evaluation_open);
                
                const buttonEnabled = studentActive && evaluationOpen;
                document.getElementById('buttonState').innerHTML = buttonEnabled ?
                    '<span class="success">ENABLED</span>' :
                    '<span class="error">DISABLED</span>';
                
            } catch (error) {
                document.getElementById('jsonResponse').textContent = 'ERROR: ' + error.message;
            }
        }
    </script>
</body>
</html>
